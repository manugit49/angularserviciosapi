<h1 style="color: blue;">Api de coches</h1>
<form #form="ngForm">
    Id coche:
    <input type="number" name="cajaid" #cajaid/>
    <button (click)="buscarCoche()">
        Buscar coche
    </button>
</form>
@if(car){
    <p>Marca: {{car.marca}} {{car.modelo}}</p>
        <p>Conductor: {{car.conductor}}</p>
        <img src="{{car.imagen}}" alt="{{car.marca}} {{car.modelo}}"/>
}

@for(coche of arraycoches; track coche){
    <p>Marca: {{coche.marca}} {{coche.modelo}}</p>
    <p>Conductor: {{coche.conductor}}</p>
    <img src="{{coche.imagen}}" alt="{{coche.marca}} {{car.modelo}}"/>
}
